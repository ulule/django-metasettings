[tox]
envlist =
    py36-dj111
downloadcache = .tox/_download/

[testenv]
whitelist_externals = make
basepython =
    py36: python3.6
commands:
    make test
deps =
    coverage
    python-dateutil
    mock
    pytz
    py36-dj111: Django>=1.11,<1.12

[testenv:mypy]
whitelist_externals = make
basepython = python3
commands = make mypy
deps =
    -rrequirements.txt
    Django>=5.2
