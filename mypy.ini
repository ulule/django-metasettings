[mypy]
plugins = mypy_django_plugin.main
files = metasettings
disallow_untyped_defs = True
check_untyped_defs = True
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True
strict_equality = True

[mypy.plugins.django-stubs]
django_settings_module = metasettings.tests.settings

[mypy-metasettings.tests.test_commands,metasettings.tests.test_fields,metasettings.tests.test_models,metasettings.tests.urls]
ignore_errors = True

[mypy-mock.*,dateutil.*]
ignore_missing_imports = True

[mypy-geoip2.*,django.contrib.gis.geoip]
ignore_missing_imports = True
